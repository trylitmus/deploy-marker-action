name: Litmus Deploy Marker
description: Post a deploy marker to Litmus so behavioral-rate shifts line up with specific releases.
author: trylitmus
branding:
  icon: flag
  color: green

inputs:
  environment:
    description: Deploy environment (production, staging, preview, etc.)
    required: false
    default: production
  version:
    description: Version string. Defaults to the first 7 characters of the commit SHA.
    required: false
    default: ''
  description:
    description: Human-readable marker description shown on the dashboard.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Post deploy marker
      shell: bash
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_DESCRIPTION: ${{ inputs.description }}
        GH_SHA: ${{ github.sha }}
        GH_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GH_RUN_NUMBER: ${{ github.run_number }}
      run: |
        set -euo pipefail

        if [ -z "${LITMUS_AUTH_TOKEN:-}" ]; then
          echo "::warning::LITMUS_AUTH_TOKEN is empty; skipping deploy marker"
          exit 0
        fi

        if [ -z "${LITMUS_SERVICE:-}" ]; then
          echo "::error::LITMUS_SERVICE is required"
          exit 1
        fi

        LITMUS_URL="${LITMUS_URL:-https://ingest.trylitmus.app}"

        VERSION="${INPUT_VERSION}"
        if [ -z "${VERSION}" ]; then
          VERSION="${GH_SHA:0:7}"
        fi

        DESCRIPTION="${INPUT_DESCRIPTION}"
        if [ -z "${DESCRIPTION}" ]; then
          DESCRIPTION="${LITMUS_SERVICE} ${INPUT_ENVIRONMENT} deploy"
        fi

        PAYLOAD=$(jq -n \
          --arg version "$VERSION" \
          --arg environment "$INPUT_ENVIRONMENT" \
          --arg commit_sha "$GH_SHA" \
          --arg repo_url "$GH_REPO_URL" \
          --arg url "$GH_RUN_URL" \
          --arg description "$DESCRIPTION" \
          --arg service "$LITMUS_SERVICE" \
          --argjson run_number "$GH_RUN_NUMBER" \
          '{
            version: $version,
            environment: $environment,
            commit_sha: $commit_sha,
            repo_url: $repo_url,
            url: $url,
            description: $description,
            metadata: {service: $service, run_number: $run_number}
          }')

        echo "Posting marker version=${VERSION} environment=${INPUT_ENVIRONMENT} service=${LITMUS_SERVICE}"

        curl --fail-with-body --silent --show-error \
          --connect-timeout 10 --max-time 30 \
          --retry 2 --retry-delay 2 --retry-connrefused \
          -X POST "${LITMUS_URL}/v1/versions" \
          -H "Authorization: Bearer ${LITMUS_AUTH_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD"
