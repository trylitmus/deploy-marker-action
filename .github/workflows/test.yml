name: Test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Empty auth token → warn + exit 0. No network traffic.
  skip-when-token-missing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        env:
          LITMUS_AUTH_TOKEN: ''
          LITMUS_SERVICE: selftest

  # Missing service → explicit error. This is a config bug, not a transient
  # failure, so we surface it rather than skipping.
  fail-when-service-missing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: run
        continue-on-error: true
        env:
          LITMUS_AUTH_TOKEN: ltm_sk_test_fake
          LITMUS_SERVICE: ''
      - name: Assert step failed
        run: |
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "expected failure, got ${{ steps.run.outcome }}"
            exit 1
          fi

  # Payload shape against a local mock. Catches jq/escape regressions.
  payload-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start mock server
        run: |
          mkdir -p /tmp/mock
          (while true; do
            printf 'HTTP/1.1 201 Created\r\nContent-Type: application/json\r\nContent-Length: 2\r\n\r\n{}' | nc -l -q 1 127.0.0.1 18081 >> /tmp/mock/req.log 2>&1
          done) &
          echo $! > /tmp/mock.pid
          sleep 1
      - uses: ./
        env:
          LITMUS_AUTH_TOKEN: ltm_sk_test_fakefakefakefakefakefakefakefake
          LITMUS_SERVICE: selftest
          LITMUS_URL: http://127.0.0.1:18081
        with:
          environment: production
      - name: Assert request body has expected shape
        run: |
          grep -q '"service":"selftest"' /tmp/mock/req.log
          grep -q '"environment":"production"' /tmp/mock/req.log
          grep -q '"run_number":' /tmp/mock/req.log
          ! grep -q '"run_number":"' /tmp/mock/req.log
      - name: Stop mock
        if: always()
        run: kill "$(cat /tmp/mock.pid)" || true
