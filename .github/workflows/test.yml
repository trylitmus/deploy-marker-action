name: Test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Empty auth token → warn + exit 0. No network traffic.
  skip-when-token-missing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        env:
          LITMUS_AUTH_TOKEN: ''
          LITMUS_SERVICE: selftest

  # Missing service → explicit error. This is a config bug, not a transient
  # failure, so we surface it rather than skipping.
  fail-when-service-missing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: run
        continue-on-error: true
        env:
          LITMUS_AUTH_TOKEN: ltm_rk_test_fake
          LITMUS_SERVICE: ''
      - name: Assert step failed
        run: |
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "expected failure, got ${{ steps.run.outcome }}"
            exit 1
          fi

  # Payload shape against a tiny python mock. Catches jq/escape regressions
  # and confirms run_number lands as a JSON number, not a string.
  payload-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start mock server
        run: |
          mkdir -p /tmp/mock
          cat > /tmp/mock/server.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get("Content-Length","0"))
                  body = self.rfile.read(n)
                  with open("/tmp/mock/req.log","wb") as f:
                      f.write(body)
                  self.send_response(201)
                  self.send_header("Content-Type","application/json")
                  self.send_header("Content-Length","2")
                  self.end_headers()
                  self.wfile.write(b"{}")
              def log_message(self, *a, **kw): pass
          HTTPServer(("127.0.0.1", 18081), H).serve_forever()
          PY
          python3 /tmp/mock/server.py &
          echo $! > /tmp/mock.pid
          # Give the server a moment to bind.
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18081/ -o /dev/null -X POST -d '{}' 2>/dev/null; then break; fi
            sleep 0.1
          done
          # Clear the warmup request so the assertion only sees the real one.
          : > /tmp/mock/req.log
      - uses: ./
        env:
          LITMUS_AUTH_TOKEN: ltm_rk_test_fakefakefakefakefakefakefakefake
          LITMUS_SERVICE: selftest
          LITMUS_URL: http://127.0.0.1:18081
        with:
          environment: production
      - name: Assert request body has expected shape
        run: |
          echo "captured body:"
          cat /tmp/mock/req.log
          echo
          # jq produces pretty-printed JSON; use jq to assert field values
          # so the test doesn't wedge on whitespace.
          jq -e '.metadata.service == "selftest"' /tmp/mock/req.log >/dev/null
          jq -e '.environment == "production"' /tmp/mock/req.log >/dev/null
          jq -e '.metadata.run_number | type == "number"' /tmp/mock/req.log >/dev/null
          jq -e '.commit_sha | length == 40' /tmp/mock/req.log >/dev/null
          jq -e '.version | length == 7' /tmp/mock/req.log >/dev/null
      - name: Stop mock
        if: always()
        run: kill "$(cat /tmp/mock.pid)" || true
